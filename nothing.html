<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>仿真浏览器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      padding: 10px;
      background-color: #f1f1f1;
      border-bottom: 1px solid #ccc;
      display: flex;
    }
    #address-bar {
      flex: 1;
      padding: 8px 12px;
      font-size: 16px;
      border: 1px solid #999;
      border-radius: 4px 0 0 4px;
    }
    #go-btn {
      padding: 8px 16px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
      font-size: 16px;
    }
    #browser-frame {
      flex: 1;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <input type="text" id="address-bar" placeholder="请输入网址（例如：https://example.com）" />
    <button id="go-btn">前往</button>
  </div>
  <iframe id="browser-frame" src="about:blank" title="仿真浏览器"></iframe>

  <script>
    const addressBar = document.getElementById('address-bar');
    const goBtn = document.getElementById('go-btn');
    const browserFrame = document.getElementById('browser-frame');

    function loadUrl(url) {
      // 简单校验是否为有效 URL
      try {
        const fullUrl = url.startsWith('http') ? url : 'https://' + url;
        new URL(fullUrl); // 验证 URL 格式
        browserFrame.src = fullUrl;
      } catch (e) {
        alert('请输入有效的网址！');
      }
    }

    goBtn.addEventListener('click', () => {
      loadUrl(addressBar.value.trim());
    });

    addressBar.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        loadUrl(addressBar.value.trim());
      }
    });

    // 初始示例：可选
    // addressBar.value = 'https://example.com';
    // loadUrl('https://example.com');
  </script>
</body>
</html>
